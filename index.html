<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Élan 30+" />
  <title>Élan 30+ • Le Programme 28 Jours Sans Matériel</title>
  <meta name="description" content="Un programme unique et progressif sur 28 jours au poids du corps pour se remettre en forme à 30 ans sans matériel." />
  <link rel="manifest" href="manifest.json?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Cabecera limpia con acceso directo al único programa de 28 días y al diccionario de ejercicios -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-group">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">ÉLAN 30+</span>
          <span class="brand-tag">Programme 28 Jours</span>
        </div>
      </div>

      <nav class="desktop-nav" aria-label="Navigation principale">
        <button type="button" class="nav-btn is-active" data-view="dashboard" aria-current="page">
          Mon Programme
        </button>
        <button type="button" class="nav-btn" data-view="exercises">
          Les 14 Mouvements
        </button>
      </nav>

      <div class="header-right">
        <div class="streak-pill" title="Série de jours actifs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
          </svg>
          <span id="header-streak-val">1 jour</span>
        </div>

        <button type="button" id="btn-sound-toggle" class="icon-btn" aria-label="Son"></button>
        <button type="button" id="btn-theme-toggle" class="icon-btn" aria-label="Thème"></button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <section id="view-dashboard" class="app-view" aria-live="polite"></section>
    <section id="view-exercises" class="app-view is-hidden" aria-live="polite"></section>
  </main>

  <nav class="mobile-bottom-nav" aria-label="Navigation mobile">
    <button type="button" class="nav-btn is-active" data-view="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="6 3 20 12 6 21 6 3"/>
      </svg>
      <span>Mon Programme</span>
    </button>
    <button type="button" class="nav-btn" data-view="exercises">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/>
      </svg>
      <span>Les 14 Mouvements</span>
    </button>
  </nav>

  <!-- Reproductor de entrenamiento con fase de observación previa -->
  <div id="workout-player-overlay" class="player-overlay is-hidden" aria-hidden="true"></div>

  <!-- Ventana modal de ficha técnica de ejercicio -->
  <div id="exercise-detail-modal" class="modal-backdrop is-hidden"></div>

  <!-- Notificación flotante -->
  <div id="app-toast" class="toast-notification" role="status" aria-live="polite"></div>

  <script src="js/logger.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/workout-engine.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
