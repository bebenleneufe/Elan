<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Élan" />
  <title>Élan</title>
  <meta name="description" content="Reprise du sport au poids du corps, 4 séances courtes par semaine." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="preload" href="assets/fonts/antonio-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-frame">
    <main class="app-main">
      <section id="view-dashboard" class="app-view" aria-label="Séance"></section>
      <section id="view-exercises" class="app-view is-hidden" aria-label="Exercices"></section>
    </main>

    <nav class="tab-bar" aria-label="Navigation">
      <button type="button" class="tab-btn is-active" data-view="dashboard" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        <span>Séance</span>
      </button>
      <button type="button" class="tab-btn" data-view="exercises">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        <span>Exercices</span>
      </button>
      <button type="button" id="btn-pwa-install" class="tab-btn is-hidden" aria-label="Installer l’application">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        <span>Installer</span>
      </button>
    </nav>

    <!-- Reproductor de sesión a pantalla completa -->
    <div id="workout-player-overlay" class="player-layer is-hidden" aria-hidden="true"></div>

    <!-- Cronómetro de marcha -->
    <div id="walk-layer" class="player-layer walk-layer is-hidden" aria-hidden="true"></div>

    <!-- Ficha de ejercicio a pantalla completa -->
    <div id="exercise-detail-modal" class="sheet-layer is-hidden" aria-hidden="true"></div>

    <div id="app-toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/logger.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/workout-engine.js"></script>
  <script src="js/treadmill.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function setupPwaAndServiceWorker() {
      let deferredInstallPrompt = null;
      const installBtn = document.getElementById('btn-pwa-install');

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        if (installBtn) installBtn.classList.remove('is-hidden');
      });

      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (!deferredInstallPrompt) return;
          deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice;
          deferredInstallPrompt = null;
          installBtn.classList.add('is-hidden');
        });
      }

      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        let refreshing = false;
        const reloadNow = () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        };
        const isWorkoutRunning = () => {
          const session = window.WorkoutEngine && window.WorkoutEngine.getActiveSession();
          return Boolean(session);
        };
        // Une mise à jour ne doit jamais couper une séance : on recharge seulement une fois celle-ci terminée
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (isWorkoutRunning()) {
            window.addEventListener('elan:workout-idle', reloadNow, { once: true });
          } else {
            reloadNow();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js', { updateViaCache: 'none' })
            .then((reg) => reg.update())
            .catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
